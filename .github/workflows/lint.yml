name: Lint Code
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    name: "Terraform Validate"
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Terraform Validate
        uses: dflook/terraform-validate@v3.0.0
        with:
          path: terraform